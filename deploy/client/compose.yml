# One isolated Qorloop instance (one organisation / store). Each client gets its own copy of this stack:
# its own PostgreSQL, Redis, object storage, secrets and pinned image versions (ADR 005).
# Started by deploy/bin/qorloop with: docker compose -p qorloop-<slug> --env-file stack.env -f compose.yml
name: qorloop-${SLUG}

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-app: &app
  image: ${API_IMAGE}
  env_file: [app.env]
  restart: unless-stopped
  logging: *logging
  # Signed storage links use the public hostname; inside the server it resolves to the edge proxy on this host.
  extra_hosts: ["${PUBLIC_HOST}:host-gateway"]
  networks: [internal]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: qorloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: qorloop
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qorloop -d qorloop"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  # Private S3-compatible storage (SeaweedFS, the same server used in local development). Reached by browsers only
  # through the edge at https://<host>/<bucket>/... with signed links; signatures are checked against that URL.
  storage:
    image: ${STORAGE_IMAGE}
    restart: unless-stopped
    logging: *logging
    command:
      - mini
      - -dir=/data
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.externalUrl=https://${PUBLIC_HOST}
      - -s3.allowedOrigins=https://${PUBLIC_HOST}
      - -s3.autoCreateBucket=false
      - -bucket=${S3_BUCKET}
      - -filer.encryptVolumeData
    volumes:
      - storagedata:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      internal: {}
      edge: { aliases: ["${SLUG}-storage"] }

  # One-off: docker compose run --rm ops <command>. Migrations, provision:store and other operations.
  ops:
    <<: *app
    restart: "no"
    profiles: [ops]
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ["node", "dist/apps/api/src/main.js"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      internal: {}
      edge: { aliases: ["${SLUG}-api"] }

  worker:
    <<: *app
    command: ["node", "dist/apps/worker/src/main.js"]
    # A worst-case 25 MB xlsx peaks at ~1.3 GB while parsing (UPLOAD_CONCURRENCY=1).
    mem_limit: 2560m
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    logging: *logging
    networks:
      edge: { aliases: ["${SLUG}-web"] }

volumes:
  pgdata:
  redisdata:
  storagedata:

networks:
  internal: {}
  edge:
    name: qorloop-edge
    external: true
