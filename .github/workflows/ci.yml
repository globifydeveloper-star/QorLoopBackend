name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      # Tests run on embedded PGlite and the in-memory upload queue/storage. TEST_DATABASE_URL (external
      # Postgres) and TEST_REDIS_URL (real-Redis suite) are deliberately unset, and no REDIS_URL, S3 or SMTP
      # secrets are given to this job.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test
